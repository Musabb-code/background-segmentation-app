services:
  backend:
    build: ./backend
    ports: ["3000:3000"]
    env_file: ./backend/.env
    volumes: ["./backend:/app", "/app/node_modules"]
    depends_on: [ml-service]

  ml-service:
    build: ./ml-service
    ports: ["8000:8000"]
    env_file: ./ml-service/.env
    volumes: ["./ml-service/models:/app/models"]
