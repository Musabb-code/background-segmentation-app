name: mackhan
description: Pixel Lift — real-time background removal for Android
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  flutter_dotenv: ^5.2.1
  camera: ^0.11.1
  google_mlkit_selfie_segmentation: ^0.8.1
  # ponytail: tflite_flutter deferred — unused in lib (ML Kit only); pulls NDK ~1GB+
  # and C: disk was full. Re-add when NDK lives on D:\Android\Sdk with free space.
  # tflite_flutter: ^0.11.0
  image: ^4.5.4
  permission_handler: ^11.4.0
  shared_preferences: ^2.5.3
  gal: ^2.3.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/.env
    - assets/models/
    - assets/branding/
    - assets/backgrounds/
